# Files that change what every test sees: any change to them selects every section.
[full_suite]
paths = ["tests/__init__.py"]

# Files the reference scan cannot connect to tests, because the code reaches them
# through a folder scan or by name at run time.
[[rules]]
paths = ["src/commands/*.py"]
sections = ["commands"]

[[rules]]
paths = ["src/web_ui/plugins/**", "src/resources/agent/**", "src/resources/meta/**"]
sections = ["plugins", "viewer"]

# The Fold View page, its scripts and the test helpers that open it reach every one of its page sections through
# the web server, not through an import: a change to any of them runs them all.
[[rules]]
paths = [
    "src/web_ui/esmfold.html", "src/web_ui/esmfold_*.js", "src/web_ui/page_text.js", "src/web_ui/residue_layers.py",
    "tests/esmfold_*", "tests/molstar_api_probe.py",
]
sections = ["fold_color", "fold_struct", "fold_canvas", "fold_session", "fold_layout", "fold_text", "fold_panel", "fold_webgl"]

# The vendored Mol* (molstar.js, its stylesheets, licence and notices) is what the page tests load.
[[rules]]
paths = ["src/resources/esmfold/molstar*", "src/resources/esmfold/*.molstar*", "src/resources/esmfold/NOTICES.*"]
sections = ["plugins", "viewer", "fold_color", "fold_struct", "fold_canvas", "fold_session", "fold_layout", "fold_text", "fold_panel", "fold_webgl"]

# What the Fold View page is served by and fed from. (The page sections that run the command or read what
# the worker writes are found by the reference scan.)
[[rules]]
paths = ["src/web_ui/esmfold_backend.py", "src/commands/esmfold*.py"]
sections = ["plugins"]

[[rules]]
paths = ["src/resources/esmfold/esmfold_worker.py"]
sections = ["plugins", "viewer"]

[[rules]]
paths = ["src/resources/languages/**", "src/resources/fonts/**"]
sections = ["language"]

[[rules]]
paths = ["docs/**"]
sections = ["language"]

[[rules]]
paths = ["src/resources/languages/*/help/**", "src/tools/tool_descriptions/**"]
sections = ["tools"]

[[rules]]
paths = ["src/resources/icons/**", "src/resources/fonts/**", "docs/**"]
sections = ["theme"]

[[rules]]
paths = ["src/resources/pLM_models/**"]
sections = ["embeddings"]

[[rules]]
paths = ["src/bin/**", "install.bat", "install.sh", "src/requirements.txt", "src/esm_runtime_requirements.txt"]
sections = ["platform"]

[[rules]]
paths = ["opt_vr", "opt_vr/**"]
sections = ["opt_vr"]

# Checks that read every src/**/*.py file. A partial run (--changed) adds them
# whenever a Python file under src/ changed, unless their own section runs anyway.
[repo_checks]
tests = [
    "tests.test_benchmark_record.RecordedDecisionTests.test_every_caller_of_rank_benchmark_results_names_its_decision",
    "tests.test_localization.ConsoleLineWriteGuardTests",
    "tests.test_studio_theme.StudioIconTests.test_every_icon_the_code_names_is_bundled",
    "tests.test_terminal_launcher.CallerIntegrationTests",
    "tests.test_untranslated_text.CanvasTextTests",
    "tests.test_update_translations.RepositoryCatalogTests",
]
