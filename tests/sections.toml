# Test sections for tests/run_sections.py.
#
# Every tests/test_*.py module belongs to exactly one section; each section runs
# in its own process, so a section gives the same verdict alone as in a full run.
# tests/test_run_sections.py fails when a module is missing here, listed twice,
# or no longer exists. Add a new test module to the section of the code it covers.
#
# `seconds` is a rough serial run time, used only to start the slowest sections
# first; after a run the runner prefers the times it measured itself.

